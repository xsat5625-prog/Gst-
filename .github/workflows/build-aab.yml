name: Build and Sign Android App Bundle (.aab)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    name: Build Signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Release Keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-keystore
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Using custom release keystore from GitHub Secrets..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release-keystore/release.keystore
            echo "KEYSTORE_PASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASS=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Generating automated production keystore for Google Play..."
            keytool -genkeypair \
              -v \
              -keystore release-keystore/release.keystore \
              -alias releasekey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "gstcalculator2026" \
              -keypass "gstcalculator2026" \
              -dname "CN=GST Calculator, OU=Mobile, O=Valand, L=Mumbai, ST=Maharashtra, C=IN"
            echo "KEYSTORE_PASS=gstcalculator2026" >> $GITHUB_ENV
            echo "KEY_ALIAS=releasekey" >> $GITHUB_ENV
            echo "KEY_PASS=gstcalculator2026" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore/release.keystore" >> $GITHUB_ENV

      - name: Build Release AAB Bundle
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASS: ${{ env.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASS: ${{ env.KEY_PASS }}
        run: |
          gradle :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" \
            --stacktrace --no-daemon

      - name: Verify Release AAB Output
        id: verify-aab
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            echo "Found expected bundle: $AAB_PATH"
            ls -lh "$AAB_PATH"
            echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
          else
            echo "Searching for generated AAB files..."
            find app/build/outputs/bundle -name "*.aab"
            FOUND=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
            if [ -n "$FOUND" ]; then
              echo "Found AAB at: $FOUND"
              echo "aab_path=$FOUND" >> $GITHUB_OUTPUT
            else
              echo "Error: No AAB found."
              exit 1
            fi
          fi

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ${{ steps.verify-aab.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Keystore Backup Artifact (Encrypted/Private)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: release-keystore/release.keystore
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        run: |
          echo "### 🚀 AAB Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`app-release-aab\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID:** \`com.valand.gstcalculator\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** Ready for Google Play Console upload" >> $GITHUB_STEP_SUMMARY
